id: com.fluentview.FluentView
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: fluent-view
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: fluent-view
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFV_WITH_LIBRAW=OFF
      - -DFV_WITH_LIBHEIF=OFF
    sources:
      - type: dir
        path: ../../..
