name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-latest
    env:
      QT_VERSION: 6.8.0
      QT_ARCH: macos   # universal Qt (arm64 + x86_64)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Add Qt to PATH
        run: echo "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

      - name: Build
        run: cmake --build build

      - name: Deploy and package (.dmg)
        run: macdeployqt build/bin/fluent-view.app -dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-macos
          path: build/bin/fluent-view.dmg
