name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.8.0
      QT_ARCH: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Add Qt to PATH
        shell: bash
        run: echo "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

      - name: Build
        run: cmake --build build

      - name: Deploy Qt libraries
        shell: bash
        run: windeployqt --qmldir qml build/bin/fluent-view.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-windows
          path: build/bin
