name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.8.0
      QT_ARCH: gcc_64
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libglib2.0-dev pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Add Qt to PATH
        run: echo "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/bin" >> "$GITHUB_PATH"

      - name: Generate application icon
        run: python3 - <<'PY'
import zlib, struct
def write_png(path, size=256, rgb=(15,123,205)):
    w = h = size
    raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
    def chunk(tag, data):
        c = tag + data
        return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
    sig = b'\x89PNG\r\n\x1a\n'
    ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
    idat = zlib.compress(raw)
    with open(path, 'wb') as f:
        f.write(sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b''))
write_png('fluent-view.png')
PY

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

      - name: Build
        run: cmake --build build

      - name: Download linuxdeploy
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage --plugin qt \
            --executable build/bin/fluent-view \
            --desktop-file packaging/linux/fluent-view.desktop \
            --icon-file fluent-view.png \
            --output appimage

      - name: Build .deb
        run: |
          ./linuxdeploy-x86_64.AppImage --output deb --plugin qt \
            --executable build/bin/fluent-view \
            --desktop-file packaging/linux/fluent-view.desktop \
            --icon-file fluent-view.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-linux
          path: |
            fluent-view*.AppImage
            fluent-view*.deb
