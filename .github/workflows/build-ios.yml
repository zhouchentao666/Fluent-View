name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# iOS build notes:
#  - Building requires a macOS runner and BOTH a macOS (host) Qt and an iOS Qt.
#  - The workflow below produces an unsigned .app (simulator/device). To ship to
#    devices you must archive + export with a signing certificate and provisioning
#    profile supplied via GitHub Secrets (see xcodebuild -archivePath / -exportArchive).

jobs:
  build:
    runs-on: macos-latest
    env:
      QT_VERSION: 6.8.0
      QT_ARCH: ios
      HOST_ARCH: macos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt (iOS target)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ${{ env.QT_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Install Qt (macOS host tools)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.HOST_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Add Qt to PATH
        run: echo "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.HOST_ARCH }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/lib/cmake/Qt6/qt.toolchain.cmake" \
          -DQT_HOST_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.HOST_ARCH }}" \
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-ios
          path: build/bin/fluent-view.app
