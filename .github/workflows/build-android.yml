name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# Android build notes:
#  - Qt requires a specific NDK version. Qt 6.8 targets NDK r26b; adjust
#    NDK_VERSION below if your Qt build expects a different one.
#  - A debug-signed APK is produced (androiddeployqt generates a debug keystore).
#    For a signed Play Store AAB, supply a release keystore via GitHub Secrets
#    and pass --release --sign ... to androiddeployqt.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.8.0
      QT_ARCH: android_arm64_v8a
      HOST_ARCH: gcc_64
      NDK_VERSION: 26.2.11394342
      ANDROID_PLATFORM: android-34
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Qt (Android target)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: ${{ env.QT_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ env.HOST_ARCH }}
          modules: qtimageformats qtshadertools
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"

      - name: Add Qt to PATH
        run: echo "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.HOST_ARCH }}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.HOST_ARCH }}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="${{ env.ANDROID_PLATFORM }}" \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package APK
        run: |
          androiddeployqt --input build/android-fluent-view-deployment-settings.json \
            --output build/android --gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-android
          path: build/android/build/outputs/apk/debug/*.apk
