name: Build All

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  QT_VERSION: 6.8.0
  # Only the add-on modules we actually need. qtquickcontrols2 (and the
  # FluentWinUI3 style) ship with the base desktop install, so they are
  # intentionally omitted here.
  QT_MODULES: qtimageformats qtshadertools

# ---------------------------------------------------------------------------
# Windows x64
# ---------------------------------------------------------------------------
jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      QT_HOST: windows
      QT_ARCH: win64_msvc2022_64
      QT_PREFIX: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        shell: bash
        run: |
          python -m pip install --upgrade pip aqtinstall
          for i in 1 2 3 4 5; do
            if python -m aqt install-qt "${{ env.QT_HOST }}" desktop "${{ env.QT_VERSION }}" "${{ env.QT_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}; then
              break
            fi
            echo "aqt attempt $i failed, retrying in 5s..."; sleep 5
          done

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

      - name: Build
        run: |
          cmake --build build

      - name: Deploy Qt libraries
        shell: bash
        run: |
          "${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/bin/windeployqt.exe" --qmldir qml build/bin/fluent-view.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-windows
          path: build/bin

# ---------------------------------------------------------------------------
# macOS universal (clang_64 build is a universal binary)
# ---------------------------------------------------------------------------
  macos:
    name: macOS universal
    runs-on: macos-latest
    env:
      QT_HOST: mac
      QT_ARCH: clang_64
      QT_PREFIX: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip aqtinstall
          for i in 1 2 3 4 5; do
            if python -m aqt install-qt "${{ env.QT_HOST }}" desktop "${{ env.QT_VERSION }}" "${{ env.QT_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}; then
              break
            fi
            echo "aqt attempt $i failed, retrying in 5s..."; sleep 5
          done

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

      - name: Build
        run: |
          cmake --build build

      - name: Deploy and package (.dmg)
        run: |
          "${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/bin/macdeployqt" build/bin/fluent-view.app -dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-macos
          path: build/bin/fluent-view.dmg

# ---------------------------------------------------------------------------
# Linux x64 (AppImage + deb)
# ---------------------------------------------------------------------------
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    env:
      QT_HOST: linux
      QT_ARCH: gcc_64
      QT_PREFIX: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libglib2.0-dev pkg-config wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip aqtinstall
          for i in 1 2 3 4 5; do
            if python -m aqt install-qt "${{ env.QT_HOST }}" desktop "${{ env.QT_VERSION }}" "${{ env.QT_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}; then
              break
            fi
            echo "aqt attempt $i failed, retrying in 5s..."; sleep 5
          done

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}"

      - name: Build
        run: |
          cmake --build build

      - name: Generate application icon
        run: |
          python3 -c "import zlib,struct; w=h=256; rgb=(15,123,205); raw=b''.join(b'\x00'+bytes(rgb)*w for _ in range(h)); ch=lambda t,d:t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); sig=b'\x89PNG\r\n\x1a\n'; open('fluent-view.png','wb').write(sig+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))"

      - name: Download linuxdeploy
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage --plugin qt --executable build/bin/fluent-view --desktop-file packaging/linux/fluent-view.desktop --icon-file fluent-view.png --output appimage

      - name: Build .deb
        run: |
          ./linuxdeploy-x86_64.AppImage --output deb --plugin qt --executable build/bin/fluent-view --desktop-file packaging/linux/fluent-view.desktop --icon-file fluent-view.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-linux
          path: |
            fluent-view*.AppImage
            fluent-view*.deb

# ---------------------------------------------------------------------------
# Android arm64
# ---------------------------------------------------------------------------
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    env:
      QT_HOST: linux
      QT_ARCH: android_arm64_v8a
      QT_HOST_ARCH: gcc_64
      QT_PREFIX: ${{ github.workspace }}/Qt
      NDK_VERSION: 26.2.11394342
      ANDROID_PLATFORM: android-34
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt (host tools + Android target)
        run: |
          python -m pip install --upgrade pip aqtinstall
          install_qt() {
            for i in 1 2 3 4 5; do
              if python -m aqt install-qt "$@"; then return 0; fi
              echo "aqt attempt $i failed, retrying"; sleep 5
            done
            return 1
          }
          install_qt "${{ env.QT_HOST }}" desktop "${{ env.QT_VERSION }}" "${{ env.QT_HOST_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}
          install_qt "${{ env.QT_HOST }}" android "${{ env.QT_VERSION }}" "${{ env.QT_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}

      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"

      - name: Configure
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_HOST_ARCH }}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="${{ env.ANDROID_PLATFORM }}" \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build

      - name: Package APK
        run: |
          "${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/bin/androiddeployqt" --input build/android-fluent-view-deployment-settings.json --output build/android --gradle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-android
          path: build/android/build/outputs/apk/debug/*.apk

# ---------------------------------------------------------------------------
# iOS arm64
# ---------------------------------------------------------------------------
  ios:
    name: iOS arm64
    runs-on: macos-latest
    env:
      QT_HOST: mac
      QT_ARCH: ios
      QT_HOST_ARCH: clang_64
      QT_PREFIX: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt (macOS host tools + iOS target)
        run: |
          python -m pip install --upgrade pip aqtinstall
          install_qt() {
            for i in 1 2 3 4 5; do
              if python -m aqt install-qt "$@"; then return 0; fi
              echo "aqt attempt $i failed, retrying"; sleep 5
            done
            return 1
          }
          install_qt "${{ env.QT_HOST }}" desktop "${{ env.QT_VERSION }}" "${{ env.QT_HOST_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}
          install_qt "${{ env.QT_HOST }}" ios "${{ env.QT_VERSION }}" "${{ env.QT_ARCH }}" --outputdir "${{ env.QT_PREFIX }}" --modules ${{ env.QT_MODULES }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/${{ env.QT_HOST_ARCH }}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: fluent-view-ios
          path: build/bin/fluent-view.app
